name: Windows installer

on:
  push:
    tags: ["v*"]
    branches: ["main", "gecmis"]   # every push runs the tests + package check (the installer is an artifact);
                                   # a release only comes from a v* tag. gecmis = History trial branch.
  workflow_dispatch:

permissions:
  contents: write

env:
  PYTHONUTF8: "1"          # Windows console is cp1252; for Turkish letters/symbols in script output

jobs:
  test:
    runs-on: windows-latest
    continue-on-error: true          # tests are informational; they don't stop packaging
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --prefer-binary -r requirements.txt pytest
      - run: python -m pytest -q tests --ignore=tests/test_ui.py

  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dependencies
        run: pip install --prefer-binary -r requirements.txt pyinstaller   # a brand-new release may not have Windows wheels yet
      - name: Package (PyInstaller)
        run: python packaging/build_exe.py
      - name: Smoke-test the package
        shell: pwsh
        run: |
          $exe = "dist\Riffle\Riffle.exe"
          python -c "import pymupdf; d=pymupdf.open(); p=d.new_page(); p.insert_text((72,72),'Test 123'); d.save('sample.pdf')"
          $env:RIFFLE_AUTOCLOSE_MS = '1500'
          $env:RIFFLE_LANG = 'en'
          $env:RIFFLE_NO_UPDATE_CHECK = '1'
          $env:RIFFLE_NO_WELCOME = '1'     # the first-run window would wait for a click
          Start-Process $exe -ArgumentList 'compress', "`"$PWD\sample.pdf`"" -Wait
          Start-Process $exe -ArgumentList 'pdf2word', "`"$PWD\sample.pdf`"" -Wait
          if (-not (Test-Path 'sample_compressed.pdf')) { throw "package: compress failed" }
          if (-not (Test-Path 'sample.docx')) { throw "package: PDF→Word failed" }
          Get-ChildItem sample*
      - name: Installer (Inno Setup)
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
          $ver = python -c "import riffle; print(riffle.__version__)"
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$ver" packaging\installer.iss
      - uses: actions/upload-artifact@v4
        with:
          name: Riffle-setup
          path: dist/Riffle-*-setup.exe
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Riffle-*-setup.exe
